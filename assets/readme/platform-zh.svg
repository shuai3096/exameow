<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">过了喵 Exameow 平台支持</title>
  <desc id="desc">六张平台卡片:Windows、macOS、Linux、Android 与 Web 已支持;iOS 需自行打包。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFBFF"/>
      <stop offset="1" stop-color="#EFEFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">

    <g>
      <rect x="32" y="32" width="352" height="128" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
      <text x="56" y="78" font-size="22" font-weight="700" fill="#131C2C">Windows</text>
      <rect x="266" y="52" width="94" height="28" rx="14" fill="#1A6CFF"/>
      <text x="313" y="71" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">已支持</text>
      <text x="56" y="120" font-size="16" fill="#73737C">.msi 安装包 · 免安装 .zip</text>
    </g>

    <g>
      <rect x="424" y="32" width="352" height="128" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
      <text x="448" y="78" font-size="22" font-weight="700" fill="#131C2C">macOS(苹果芯片)</text>
      <rect x="658" y="52" width="94" height="28" rx="14" fill="#1A6CFF"/>
      <text x="705" y="71" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">已支持</text>
      <text x="448" y="120" font-size="16" fill="#73737C">.dmg(去除隔离见 Release 说明)</text>
    </g>

    <g>
      <rect x="816" y="32" width="352" height="128" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
      <text x="840" y="78" font-size="22" font-weight="700" fill="#131C2C">Linux</text>
      <rect x="1050" y="52" width="94" height="28" rx="14" fill="#1A6CFF"/>
      <text x="1097" y="71" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">已支持</text>
      <text x="840" y="120" font-size="16" fill="#73737C">.AppImage · .deb(x86_64/ARM64)</text>
    </g>

    <g>
      <rect x="32" y="180" width="352" height="128" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
      <text x="56" y="226" font-size="22" font-weight="700" fill="#131C2C">Android (ARM64)</text>
      <rect x="266" y="200" width="94" height="28" rx="14" fill="#1A6CFF"/>
      <text x="313" y="219" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">已支持</text>
      <text x="56" y="268" font-size="16" fill="#73737C">.apk</text>
    </g>

    <g>
      <rect x="424" y="180" width="352" height="128" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
      <text x="448" y="226" font-size="22" font-weight="700" fill="#131C2C">iOS</text>
      <rect x="652" y="200" width="100" height="28" rx="14" fill="#F2994A"/>
      <text x="702" y="219" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">自行打包</text>
      <text x="448" y="268" font-size="16" fill="#73737C">Xcode 自行打包</text>
    </g>

    <g>
      <rect x="816" y="180" width="352" height="128" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
      <text x="840" y="226" font-size="22" font-weight="700" fill="#131C2C">Web / Docker</text>
      <rect x="1050" y="200" width="94" height="28" rx="14" fill="#1A6CFF"/>
      <text x="1097" y="219" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">已支持</text>
      <text x="840" y="268" font-size="16" fill="#73737C">Docker 镜像 · docker compose</text>
    </g>

  </g>
</svg>
