<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" role="img" aria-labelledby="title desc">
  <title id="title">Exameow architecture</title>
  <desc id="desc">Layered diagram: Vue 3 frontend on top, Rust Axum server with parser, AI client, exam builder and export in the middle, and four deploy targets at the bottom.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFBFF"/>
      <stop offset="1" stop-color="#EFEFFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="512" rx="28" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">

    <rect x="32" y="32" width="1136" height="88" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
    <text x="64" y="84" font-size="24" font-weight="700" fill="#131C2C">Frontend</text>
    <text x="1136" y="84" font-size="20" fill="#575F71" text-anchor="end">Vue 3 + Vite + Pinia · served as static files</text>

    <path d="M588 130 L600 142 L612 130" fill="none" stroke="#8CACFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="32" y="148" width="1136" height="190" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
    <text x="64" y="192" font-size="24" font-weight="700" fill="#131C2C">Server — Rust / Axum</text>

    <g>
      <rect x="80" y="212" width="248" height="104" rx="16" fill="#F0F0F9"/>
      <text x="100" y="248" font-size="20" font-weight="700" fill="#0059BE">File Parser</text>
      <text x="100" y="276" font-size="16" fill="#73737C">PDF · DOCX · XLSX · PPTX</text>
      <text x="100" y="298" font-size="16" fill="#73737C">EPUB · images · text</text>
    </g>
    <g>
      <rect x="344" y="212" width="248" height="104" rx="16" fill="#F0F0F9"/>
      <text x="364" y="248" font-size="20" font-weight="700" fill="#0059BE">AI Client</text>
      <text x="364" y="276" font-size="16" fill="#73737C">OpenAI-compatible API</text>
      <text x="364" y="298" font-size="16" fill="#73737C">any endpoint &amp; key</text>
    </g>
    <g>
      <rect x="608" y="212" width="248" height="104" rx="16" fill="#F0F0F9"/>
      <text x="628" y="248" font-size="20" font-weight="700" fill="#0059BE">Exam Builder</text>
      <text x="628" y="276" font-size="16" fill="#73737C">prompt engineering</text>
      <text x="628" y="298" font-size="16" fill="#73737C">+ response parsing</text>
    </g>
    <g>
      <rect x="872" y="212" width="248" height="104" rx="16" fill="#F0F0F9"/>
      <text x="892" y="248" font-size="20" font-weight="700" fill="#0059BE">Export</text>
      <text x="892" y="276" font-size="16" fill="#73737C">XLSX via hand-rolled</text>
      <text x="892" y="298" font-size="16" fill="#73737C">ZIP+XML · CSV</text>
    </g>

    <path d="M588 346 L600 358 L612 346" fill="none" stroke="#8CACFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="32" y="364" width="1136" height="116" rx="20" fill="#FFFFFF" stroke="#DBE1FF" stroke-width="2"/>
    <text x="64" y="408" font-size="24" font-weight="700" fill="#131C2C">Deploy Targets</text>

    <g font-size="17" fill="#002E68" text-anchor="middle">
      <rect x="80" y="424" width="248" height="40" rx="20" fill="#DBE1FF"/>
      <text x="204" y="450">Docker · self-hosted</text>
      <rect x="344" y="424" width="248" height="40" rx="20" fill="#DBE1FF"/>
      <text x="468" y="450">Desktop · Win/macOS/Linux</text>
      <rect x="608" y="424" width="248" height="40" rx="20" fill="#DBE1FF"/>
      <text x="732" y="450">Mobile · Android / iOS</text>
      <rect x="872" y="424" width="248" height="40" rx="20" fill="#DBE1FF"/>
      <text x="996" y="450">Cloudflare Pages + Worker</text>
    </g>

  </g>
</svg>
